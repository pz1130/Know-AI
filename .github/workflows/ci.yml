name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Glossary parity (zh/en)
        run: node ../scripts/check-glossary.mjs
      - name: Handbook ↔ site glossary drift
        run: node ../scripts/sync-glossary.mjs --strict
      - name: Mind map links resolve
        run: node ../scripts/check-mindmap.mjs
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx oxlint
      - name: Build
        run: npx vite build
